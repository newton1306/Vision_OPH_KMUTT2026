<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Workshop Suite - KMUTT Open House 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen Background Image -->
  <div id="bg-wrapper">
    <img id="bg-img" src="assets/cv_bg.png" alt="Vision OPH Background">
  </div>

  <!-- Main Menu Overlay (Fades in when background blurs on mouse move) -->
  <main id="menu-container">
    <header class="menu-header">
      <div class="event-badge">KMUTT OPEN HOUSE 2026</div>
      <h1 class="main-title">VISION WORKSHOP SUITE</h1>
      <p class="subtitle">Computer Vision & Interactive AI Motion Experience</p>
    </header>

    <!-- 2 High-Tech Mech Armor Selection Boxes in Center -->
    <div class="cards-grid">
      <!-- Card 1: Fruit Neptune (Mech Chassis - Plasma Amber / KMUTT Flame) -->
      <button class="menu-card mech-card fruit-card" data-app="fruit-ninja" tabindex="1">
        <!-- Mechanical Corner Accent Bracket & Top Tabs -->
        <div class="mech-corner-bracket"></div>
        <div class="mech-top-tabs">
          <span class="mech-tab"></span>
          <span class="mech-tab"></span>
        </div>

        <div class="mech-inner">
          <div class="mech-header">
            <span class="mech-id-tag">MOD // 01</span>
            <span class="mech-status-tag"><span class="status-pulse pulse-orange"></span>READY</span>
          </div>

          <div class="mech-dotted-line"></div>

          <div class="mech-core">
            <div class="mech-logo-box">
              <img src="assets/fruit_logo.png" alt="Fruit Neptune" class="mech-logo fruit-logo">
            </div>
            <h2 class="mech-title">FRUIT NEPTUNE</h2>
            <p class="mech-subtitle">3D MOTION AR SLICING</p>
          </div>

          <div class="mech-dotted-line"></div>

          <div class="mech-action-btn">
            <span>ENTER GAME</span>
            <span class="btn-arrow">➜</span>
          </div>
        </div>
      </button>

      <!-- Card 2: CV Workshop (Mech Chassis - Cyber Neon Cyan / Neural Blue) -->
      <button class="menu-card mech-card cv-card" data-app="cv-workshop" tabindex="2">
        <!-- Mechanical Corner Accent Bracket & Top Tabs -->
        <div class="mech-corner-bracket"></div>
        <div class="mech-top-tabs">
          <span class="mech-tab"></span>
          <span class="mech-tab"></span>
        </div>

        <div class="mech-inner">
          <div class="mech-header">
            <span class="mech-id-tag">MOD // 02</span>
            <span class="mech-status-tag"><span class="status-pulse pulse-cyan"></span>ONLINE</span>
          </div>

          <div class="mech-dotted-line"></div>

          <div class="mech-core">
            <div class="mech-logo-box">
              <svg class="mech-logo cv-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="32" cy="32" r="30" stroke="#00f0ff" stroke-width="2.5" fill="#0b1320" fill-opacity="0.9"/>
                <circle cx="32" cy="32" r="22" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 2"/>
                <!-- AI Eye / Aperture Lens -->
                <ellipse cx="32" cy="32" rx="16" ry="10" stroke="#00f0ff" stroke-width="2"/>
                <circle cx="32" cy="32" r="6" fill="#38bdf8"/>
                <circle cx="34" cy="30" r="2" fill="#ffffff"/>
                <!-- Arc Radar Beams -->
                <path d="M12 32 H4 M60 32 H52 M32 12 V4 M32 60 V52" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            </div>
            <h2 class="mech-title">CV WORKSHOP</h2>
            <p class="mech-subtitle">AI BLOCK CODING STUDIO</p>
          </div>

          <div class="mech-dotted-line"></div>

          <div class="mech-action-btn">
            <span>ENTER STUDIO</span>
            <span class="btn-arrow">➜</span>
          </div>
        </div>
      </button>
    </div>
  </main>

  <script src="menu.js"></script>
</body>
</html>
